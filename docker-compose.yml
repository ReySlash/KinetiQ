services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: kinetiq-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinetiq}
      POSTGRES_USER: ${POSTGRES_USER:-kinetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinetiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-test:
    image: postgres:18.4-alpine3.24
    profiles: [test]
    container_name: kinetiq-postgres-test
    environment:
      POSTGRES_DB: kinetiq_test
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: kinetiq
    ports:
      - "5433:5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
