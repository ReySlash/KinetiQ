map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=kinetiq_api:10m rate=10r/s;

log_format kinetiq_json escape=json
    '{"timestamp":"$time_iso8601","service":"web","requestId":"$request_id",'
    '"method":"$request_method","route":"$uri","status":$status,'
    '"durationMs":$request_time,"client":"$remote_addr"}';

server {
    listen 80;
    server_name kinetiq.reyslash.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kinetiq.reyslash.com;

    ssl_certificate /etc/letsencrypt/live/kinetiq.reyslash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinetiq.reyslash.com/privkey.pem;
    client_max_body_size 2m;
    access_log /var/log/nginx/kinetiq.access.log kinetiq_json;
    error_log /var/log/nginx/kinetiq.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        limit_req zone=kinetiq_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
